name: Compilar e empacotar loja Macumbiinha
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do site
        uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes do e-commerce
        run: npm test
      - name: Compilar site estático
        run: npm run build
      - name: Disponibilizar pacote para upload manual
        uses: actions/upload-artifact@v4
        with:
          name: macumbiinha-cloudflare-out
          path: out/
          if-no-files-found: error
          retention-days: 14
      - name: Indicar publicação em produção
        run: |
          echo "::notice::Build e pacote concluídos. A publicação no Pages é controlada por leleco2/macumbiinha-crm em .github/workflows/deploy-storefront.yml."
