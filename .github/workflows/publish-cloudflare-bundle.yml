name: Publicar Macumbiinha na Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do site
        uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes do e-commerce
        run: npm test
      - name: Compilar site estático
        run: npm run build
      - name: Disponibilizar pacote para upload manual
        uses: actions/upload-artifact@v4
        with:
          name: macumbiinha-cloudflare-out
          path: out/
          if-no-files-found: error
          retention-days: 14
      - name: Publicar atualização no Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0c4c6e226af971ccaf0490eff6b90d60
        run: npx wrangler pages deploy out --project-name macumbiinha --branch main --commit-hash "${GITHUB_SHA}"
      - name: Avisar se credencial de deploy ainda não foi configurada
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN ainda não configurado em Settings > Secrets and variables > Actions. Baixe o artefato macumbiinha-cloudflare-out para upload manual no Pages."
